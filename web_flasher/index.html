<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installation CNC32-TFT</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            max-width: 500px;
        }
        h1 { margin-top: 0; color: #fff; }
        p { line-height: 1.5; margin-bottom: 25px; }
        esp-web-install-button { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Installation CNC32-TFT</h1>
        <p>Branchez votre écran ESP32 en USB à cet ordinateur.<br>Cliquez sur le bouton ci-dessous pour flasher le firmware.</p>
        
        <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
    </div>

    <!-- Script requis pour le composant web ESP Web Tools -->
    <script type="module" src="https://unpkg.com/esp-web-tools@9.4.2/dist/web/install-button.js?module"></script>
</body>
</html>
