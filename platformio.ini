; CNC32-TFT app — interface ESP32 pour piloter une carte FluidNC (GRBL) en UART
; Cible matérielle : écran TFT maker.fr Version 2 / HSPI
;   ESP32 classique + ST7796 480x320 (HSPI) + tactile XPT2046 résistif (VSPI)
;   Liaison FluidNC : Serial2 (RX=16, TX=17) @115200
;
; Build  : pio run
; Upload : pio run --target upload
; Moniteur série : pio device monitor
;
; UI v2 (rail + 5 écrans, JobRunner, palpage, position outil NVS) : aucune
; dépendance supplémentaire — Preferences/SD/SPI sont dans le core ESP32, et
; canvas/bar LVGL sont activés dans include/lv_conf.h. Ce fichier est inchangé.

[env:cnc32-tft]
platform = espressif32
board = esp32dev
framework = arduino

; Plus d'espace applicatif (pas d'OTA) — LVGL + LovyanGFX
board_build.partitions = huge_app.csv

build_flags =
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I include
	-D CORE_DEBUG_LEVEL=2

lib_deps =
	lvgl/lvgl@^8.3.11
	lovyan03/LovyanGFX@^1.1.12
	fastled/FastLED@^3.6.0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
