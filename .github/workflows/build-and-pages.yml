name: Build & Publish Web Flasher

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run

      - name: Prepare Web Flasher Files
        run: |
          # Create public directory for GitHub Pages
          mkdir public
          
          # Copy HTML and Manifest
          cp web_flasher/index.html public/
          cp web_flasher/manifest.json public/
          
          # Copy the binaries generated by PlatformIO to the public folder
          # Firmware
          cp .pio/build/cnc32-tft/firmware.bin public/
          # Partitions
          cp .pio/build/cnc32-tft/partitions.bin public/
          
          # Bootloader and Boot app are usually deep in the platformio packages, 
          # but we can find them dynamically for ESP32.
          # PlatformIO standard ESP32 Arduino paths:
          BOOTLOADER_PATH=$(find ~/.platformio/packages -name "bootloader_dio_40m.bin" | head -n 1)
          BOOT_APP_PATH=$(find ~/.platformio/packages -name "boot_app0.bin" | head -n 1)
          
          cp "$BOOTLOADER_PATH" public/bootloader.bin
          cp "$BOOT_APP_PATH" public/boot_app0.bin

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
