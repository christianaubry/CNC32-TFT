name: Build & Publish Web Flasher

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run

      - name: Prepare Web Flasher Files
        run: |
          set -e  # Stop on first error
          
          echo "Creating public directory..."
          mkdir -p public
          
          echo "Copying web flasher HTML and manifest..."
          cp web_flasher/index.html public/
          cp web_flasher/manifest.json public/
          
          echo "Copying PlatformIO generated binaries..."
          cp .pio/build/cnc32-tft/firmware.bin public/
          cp .pio/build/cnc32-tft/partitions.bin public/
          cp .pio/build/cnc32-tft/bootloader.bin public/
          
          echo "Searching for boot_app0.bin..."
          BOOT_APP_PATH=$(find ~/.platformio/packages -name "boot_app0.bin" 2>/dev/null | head -n 1 || echo "")
          
          if [ -n "$BOOT_APP_PATH" ] && [ -f "$BOOT_APP_PATH" ]; then
            echo "Found boot_app0.bin at $BOOT_APP_PATH"
            cp "$BOOT_APP_PATH" public/boot_app0.bin
          else
            echo "boot_app0.bin not found locally. Downloading from Arduino ESP32 repository..."
            wget -q -O public/boot_app0.bin https://raw.githubusercontent.com/espressif/arduino-esp32/master/tools/partitions/boot_app0.bin
          fi
          
          echo "Contents of public directory:"
          ls -la public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
